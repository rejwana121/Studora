[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's Depends() in argument defaults is the framework's own DI idiom,
# not the mutable-default-argument bug B008 targets.
"app/api/**/*.py" = ["B008"]
"app/core/security.py" = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["."]
